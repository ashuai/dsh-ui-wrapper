name: Rust

on:
  # 规则:只有 changelog/ 出现新版本文件(或 workflow 自身变更)才自动编译;
  # 平时改 src/、README 等不触发。想随时手动编译用 workflow_dispatch。
  push:
    branches: [ "main" ]
    paths:
      - 'changelog/**'
      - '.github/workflows/**'
  workflow_dispatch: # GitHub → Actions → Run workflow 手动触发

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # macOS = 主要目标;Windows 11 = 验证 wry/winit 跨平台;Linux = 编译体检
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      # wry 在 Linux 上需要 WebKitGTK 等系统依赖才能编译
      - name: Install Linux system deps
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev

      - uses: Swatinem/rust-cache@v2

      - name: Build
        run: cargo build --verbose

      - name: Run tests
        run: cargo test --verbose
