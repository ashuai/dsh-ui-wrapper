[package]
name = "dsh"
version = "0.1.0"
edition = "2021"
description = "DSH — 极简壳:用系统浏览器核心(WebKit)打开本机 dsh web 界面"

[[bin]]
name = "DSH"
path = "src/main.rs"

[dependencies]
wry = { version = "0.56", features = ["devtools"] }
tao = "0.36"
serde_json = "1"
libc = "0.2"

# macOS 主菜单(Cmd+V/Cmd+C 等快捷键依赖 AppKit 菜单路由)
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = "0.3"
objc2-foundation = "0.3"
objc2-web-kit = "0.3"
